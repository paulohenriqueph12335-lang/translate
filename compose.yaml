name: tradutor-documental

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradutor}
      POSTGRES_USER: ${POSTGRES_USER:-tradutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tradutor-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev-only-change-this-s3-secret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object_storage_data:/data
    restart: unless-stopped

  # Tradução automática gratuita e local (ADR-008): o documento não sai da infraestrutura.
  translator:
    image: libretranslate/libretranslate:v1.9.6
    environment:
      LT_LOAD_ONLY: en,pt,fr,it,es
      LT_DISABLE_WEB_UI: "true"
      LT_THREADS: ${TRANSLATOR_THREADS:-4}
    ports:
      - "127.0.0.1:${TRANSLATOR_PORT:-15050}:5000"
    volumes:
      - translator_models:/home/libretranslate/.local
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)\""]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
    command: ["pnpm", "--filter", "@tradutor/api", "migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
      S3_ENDPOINT: http://object-storage:8333
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tradutor-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-only-change-this-s3-secret}
      UPLOAD_MAX_FILE_MB: ${UPLOAD_MAX_FILE_MB:-50}
      UPLOAD_MAX_BATCH_FILES: ${UPLOAD_MAX_BATCH_FILES:-100}
      UPLOAD_MAX_BATCH_MB: ${UPLOAD_MAX_BATCH_MB:-1024}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://object-storage:8333
      S3_BUCKET: ${S3_BUCKET:-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tradutor-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-only-change-this-s3-secret}
      S3_REGION: ${S3_REGION:-us-east-1}
      # Tradução automática gratuita (ADR-008): LibreTranslate local; DeepL Free opcional (chave terminada em ":fx").
      LIBRETRANSLATE_URL: http://translator:5000
      DEEPL_API_KEY: ${DEEPL_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started
      # O worker funciona sem o tradutor (rascunho manual); só espera ele iniciar.
      translator:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  object_storage_data:
  translator_models:
