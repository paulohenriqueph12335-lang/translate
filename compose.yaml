name: tradutor-documental

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradutor}
      POSTGRES_USER: ${POSTGRES_USER:-tradutor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  object-storage:
    image: chrislusf/seaweedfs:4.48
    command: server -s3 -dir=/data
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-tradutor-local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-dev-only-change-this-s3-secret}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - object_storage_data:/data
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
    command: ["pnpm", "--filter", "@tradutor/api", "migrate"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-120}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-tradutor}:${POSTGRES_PASSWORD:-dev-only-change-me}@postgres:5432/${POSTGRES_DB:-tradutor}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      S3_ENDPOINT: http://object-storage:8333
      S3_BUCKET: documents
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-tradutor-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-only-change-this-s3-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      object-storage:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  object_storage_data:
